
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Management Study Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Cash Management & Treasury Study Guide</h1>
    <p>Your customizable banking knowledge base</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h2>Topics</h2>
      <ul id="topicList"></ul>

      <div class="add-topic">
        <input type="text" id="newTopic" placeholder="New topic name">
        <button onclick="addTopic()">Add Topic</button>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <button onclick="saveNotes()">Save Notes</button>
        <button onclick="exportData()">Export Backup</button>
      </div>

      <section id="contentArea">
        <h2 id="topicTitle"></h2>
        <textarea id="topicContent"></textarea>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
